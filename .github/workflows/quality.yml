name: Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  bootstrap-check:
    if: ${{ hashFiles('package.json') == '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository bootstrap status
        run: echo "REZAN repository bootstrap is ready. Upload the application package.json and source tree to enable full CI."
